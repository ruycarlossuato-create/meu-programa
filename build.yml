nane: build
on: [push]
jobs:
b:
  runs-on: windows-latest
  steps
  - uses: actions/checkout@v4
  - uses: actions/setup-python@v5
  with:
    python-version: '3.11'
    - run: pip install pyinstaller
    - run: pyinstaller --onefile overlay_bancario_nexus_supremo.py
    - uses: actions/upload-artifact@v4
    with:
    name: exe
    path: dist/*.exe
